<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Notas Rápidas</title>
  <script type="text/javascript" src="js/script.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Sistema de Notas Rápidas</h1>

  <div class="controle"><br>
    <input type="text" id="textoNota"><br>
    <span>Digite sua nota</span><br>
    <br>
    <input type="radio" name="tipo" value="urgente"> Urgente
    <input type="radio" name="tipo" value="nao-urgente" checked> Não urgente
     </div>
    <br><br>
    <button onclick="adicionarNota()">Adicionar</button>
    <button onclick="apagarTudo()">Apagar tudo</button>

    <div class="box1">
      <h3>Urgentes</h3>
      <ul id="listaurgente" ></ul>
  </div>

    
  <div class="box2">
    <h3>Não Urgentes</h3>
    <ul id="listanurgente"></ul>
  </div>
  
</body>
</html>
